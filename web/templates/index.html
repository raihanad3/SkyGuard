<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚢 Vessel Guard — Indonesian Waters Monitor</title>
    <meta name="description" content="Real-time monitoring system for detecting anomalous vessels in Indonesian territorial waters.">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- App CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header" id="main-header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">🛡️</span>
                <div class="logo-text">
                    <h1>VESSEL GUARD</h1>
                    <span class="logo-subtitle">Indonesian Waters Anomaly Detection</span>
                </div>
            </div>
        </div>
        <div class="header-center">
            <div class="status-indicator" id="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
        </div>
        <div class="header-right">
            <div class="clock" id="live-clock"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Stats Bar -->
        <section class="stats-bar" id="stats-section">
            <div class="stat-card" id="stat-vessels">
                <div class="stat-icon">🚢</div>
                <div class="stat-info">
                    <span class="stat-value" id="total-vessels">0</span>
                    <span class="stat-label">Kapal Terpantau</span>
                </div>
            </div>
            <div class="stat-card" id="stat-positions">
                <div class="stat-icon">📍</div>
                <div class="stat-info">
                    <span class="stat-value" id="total-positions">0</span>
                    <span class="stat-label">Data Points</span>
                </div>
            </div>
            <div class="stat-card alert-high" id="stat-high">
                <div class="stat-icon">🚨</div>
                <div class="stat-info">
                    <span class="stat-value" id="alert-high-count">0</span>
                    <span class="stat-label">High Alert</span>
                </div>
            </div>
            <div class="stat-card alert-medium" id="stat-medium">
                <div class="stat-icon">⚠️</div>
                <div class="stat-info">
                    <span class="stat-value" id="alert-medium-count">0</span>
                    <span class="stat-label">Medium Alert</span>
                </div>
            </div>
            <div class="stat-card alert-low" id="stat-low">
                <div class="stat-icon">ℹ️</div>
                <div class="stat-info">
                    <span class="stat-value" id="alert-low-count">0</span>
                    <span class="stat-label">Low Alert</span>
                </div>
            </div>
        </section>

        <!-- Map & Alerts Container -->
        <div class="content-grid">
            <!-- Map -->
            <div class="map-container" id="map-section">
                <div class="panel-header">
                    <span class="panel-title">🗺️ Live Vessel Map</span>
                    <div class="map-legend">
                        <span class="legend-item"><span class="legend-dot normal"></span>Normal</span>
                        <span class="legend-item"><span class="legend-dot low"></span>Low</span>
                        <span class="legend-item"><span class="legend-dot medium"></span>Medium</span>
                        <span class="legend-item"><span class="legend-dot high"></span>High</span>
                    </div>
                </div>
                <div id="map"></div>
            </div>

            <!-- Alert Panel -->
            <div class="alert-panel" id="alert-section">
                <div class="panel-header">
                    <span class="panel-title">🔔 Alert Feed</span>
                    <button class="btn-clear" id="btn-clear-alerts" onclick="clearAlerts()">Clear</button>
                </div>
                <div class="alert-list" id="alert-list">
                    <div class="alert-placeholder">
                        <span class="placeholder-icon">📡</span>
                        <p>Waiting for incoming vessel data...</p>
                        <p class="placeholder-sub">Alerts will appear here in real-time</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Vessel Info Panel (appears on click) -->
        <div class="vessel-detail-panel" id="vessel-detail" style="display:none;">
            <div class="panel-header">
                <span class="panel-title" id="vessel-detail-title">Vessel Detail</span>
                <button class="btn-close" onclick="closeVesselDetail()">✕</button>
            </div>
            <div class="vessel-detail-content" id="vessel-detail-content"></div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
